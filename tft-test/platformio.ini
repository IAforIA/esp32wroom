; ============================================================================
;  Display test - ESP32-WROOM + 2.4" ILI9341 (VSPI)
;  Purpose: confirm the display wiring before anything else.
;
;  The display pin mapping is passed through build_flags (the clean way in
;  PlatformIO - no need to edit the library's User_Setup.h).
; ============================================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port   = COM8
monitor_port  = COM8

lib_deps =
    bodmer/TFT_eSPI

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    ; ---- Display (VSPI) ----
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=5
    -D TFT_BACKLIGHT_ON=HIGH
    ; ---- Fonts ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
